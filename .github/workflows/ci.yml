name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate operations inventory
        run: npm run ops:validate

      - name: Build
        run: npm run build

      - name: Build MCP server
        run: npm run build -w deftrack-mcp

      - name: Test
        run: npm run test:ci

      - name: Install Chromium for browser smoke tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e:smoke -w @defcon/client
