# Reference nginx snippet: accept connections only from Cloudflare edges.
# Install as /etc/nginx/snippets/cloudflare-allowlist.conf and include it in
# every server block that proxies to the app (see nginx-deftrack.conf).
#
# Source: https://www.cloudflare.com/ips/ (plain lists at /ips-v4 and /ips-v6).
# Cloudflare changes these ranges occasionally: compare this file with the
# published lists from time to time, then run `sudo nginx -t` and reload nginx.
# Ranges below match the published lists as of 2026-09-23.

# IPv4
allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;

# IPv6
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

# Local checks on the host itself
allow 127.0.0.1;
allow ::1;

deny all;
