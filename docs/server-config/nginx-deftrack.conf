# Reference nginx site for DefTrack behind Cloudflare.
# Install as /etc/nginx/sites-available/deftrack, link it into sites-enabled,
# replace deftrack.xyz with your own domain, then run `sudo nginx -t` and reload.
#
# - nginx is a pure reverse proxy. The Node app on 127.0.0.1:3001 serves the
#   API, the /ws WebSocket endpoint and the built client.
# - Only Cloudflare edges may reach the app (cloudflare-allowlist.conf). The
#   port 80 block only sends a redirect and answers any client: nginx runs
#   `return` before allow/deny, so an allowlist there would have no effect.
# - The app sets Content-Security-Policy, Strict-Transport-Security and
#   Permissions-Policy. Do not hide, override or duplicate them here.
# - The port 80 block only redirects, so use Cloudflare SSL/TLS mode
#   "Full (strict)". "Flexible" would loop.
# - The ssl_* lines follow the layout certbot (Let's Encrypt) writes.

# Catch-all: close connections for any Host this site does not serve,
# including requests addressed to the server's IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Refuse the TLS handshake without presenting a certificate (nginx 1.19.4+).
    # On older nginx, configure a self-signed certificate here instead.
    ssl_reject_handshake on;

    return 444;
}

# HTTP: redirect the site's hostnames to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name deftrack.xyz www.deftrack.xyz;

    return 301 https://$host$request_uri;
}

# HTTPS: proxy everything to the app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name deftrack.xyz www.deftrack.xyz;

    ssl_certificate /etc/letsencrypt/live/deftrack.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deftrack.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cloudflare-allowlist.conf;

    location /ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # IP forwarding for WS upgrade. cloudflare-allowlist.conf restricts
        # $remote_addr to Cloudflare edges, so CF-Connecting-IP is the only
        # client-controlled value we trust. We OVERRIDE (not append) XFF
        # and X-Real-IP so the app's per-IP WS cap can't be spoofed.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP forwarding for HTTP. Same rationale as the /ws block: OVERRIDE
        # the client-supplied XFF so a malicious caller can't pre-pend a
        # spoofed IP and bypass per-IP rate limiting.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
